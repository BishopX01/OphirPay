apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ophirpay.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ophirpay.labels" . | nindent 4 }}
spec:
  {{- /*
    Issue #1331 — never render spec.replicas while the HPA owns the replica
    count. `helm upgrade` would otherwise reset the Deployment to
    `.Values.replicaCount` on every release, undoing whatever the autoscaler had
    scaled to and dropping pods mid-deploy.
  */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "ophirpay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /*
          Issue #1332 — the containers read config and secrets through envFrom,
          which copies the values into the pod at start time. Without a
          checksum of the rendered config.yaml a `helm upgrade` that only
          changes a config or secret value updates the ConfigMap/Secret but
          leaves every running pod on the old environment. Hashing the template
          output changes the pod template on any config/secret edit and the
          RollingUpdate strategy then rolls the pods.
        */}}
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ophirpay.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ophirpay.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          {{- /* Issue #1333 — immutable reference: digest > tag > Chart.appVersion. */}}
          image: {{ include "ophirpay.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "ophirpay.fullname" . }}-config
            {{- /* Issue #1334 — existingSecret keeps credentials out of values.yaml. */}}
            - secretRef:
                name: {{ include "ophirpay.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
